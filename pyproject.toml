[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicadores-azure"
version = "0.1.0"
description = "Prueba de arquitectura en Azure: carga de archivos desde el blob a MySQL"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1,<2",
    "openpyxl>=3.1,<4",
    "azure-storage-blob>=12.19,<13",
    "azure-storage-queue>=12.9,<13",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
indicadores-azure-procesar = "indicadores_azure.procesar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
