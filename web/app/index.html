<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indicadores de operación</title>
  <style>
    :root { --bg:#f4f6f8; --card:#ffffff; --text:#1f2933; --muted:#616e7c; --accent:#0b5cad; --line:#d9e2ec; --ok:#1e7b34; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--accent); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:1.25rem; font-weight:600; }
    .user { font-size:.9rem; display:flex; gap:12px; align-items:center; }
    .user a { color:#fff; }
    nav { display:flex; gap:4px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; }
    nav button { border:0; background:none; padding:12px 16px; font:inherit; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
    nav button[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    main { max-width:1300px; margin:20px auto; padding:0 16px; }
    .card { background:var(--card); border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:16px; }
    .card h2 { margin:0 0 4px; font-size:1.05rem; }
    .card p { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
    .report { position:relative; width:100%; padding-top:56.25%; }
    .report iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    [hidden] { display:none !important; }
    form { display:grid; gap:14px; max-width:560px; }
    label { display:grid; gap:6px; font-size:.9rem; font-weight:600; }
    select, input[type=file] { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .boton { justify-self:start; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
    .boton:disabled { opacity:.6; cursor:wait; }
    .resultado { margin-top:16px; padding:12px 14px; border-radius:6px; font-size:.95rem; border:1px solid var(--line); white-space:pre-wrap; }
    .resultado.ok { border-color:var(--ok); color:var(--ok); background:#ecf7ee; }
    .resultado.err { border-color:var(--err); color:var(--err); background:#fdecea; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin:24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Indicadores de operación</h1>
    <div class="user"><span id="usuario"></span><a href="/.auth/logout">Cerrar sesión</a></div>
  </header>
  <nav id="pestanas" role="tablist"></nav>
  <main>
    <section class="card" id="panel-reporte">
      <h2 id="titulo"></h2>
      <p id="descripcion"></p>
      <div class="report"><iframe id="reporte" title="Reporte" allowfullscreen="true"></iframe></div>
    </section>

    <section class="card" id="panel-carga" hidden>
      <h2>Cargar archivos</h2>
      <p>El archivo se guarda en Azure y lo procesa el job de carga. El resultado aparece abajo en menos de un minuto.</p>
      <form id="form-carga">
        <label>Tipo de archivo
          <select id="tipo">
            <option value="anexo1">Anexo 1 – Horarios de operación</option>
          </select>
        </label>
        <label>Archivo (.xlsx)
          <input type="file" id="archivo" accept=".xlsx" required>
        </label>
        <button class="boton" id="btn-cargar" type="submit">Subir y cargar</button>
      </form>
      <div id="resultado" class="resultado" hidden></div>
    </section>
  </main>
  <footer>Datos de prueba · se actualizan al republicar el reporte</footer>

  <script>
    // ===== Edita solo esta lista =====
    // url: el enlace de "Publicar en la web" de cada reporte.
    // Para abrir una página concreta del mismo reporte, agrega &pageName=ReportSectionXXXX
    const DASHBOARDS = [
      {
        nombre: "IP del mes",
        descripcion: "Índice de puntualidad por expedición.",
        url: "https://app.powerbi.com/view?r=eyJrIjoiMWQyOGQ0MmEtN2VlZi00OGMyLThlMWEtYzk3ODgzNzQ5OWRiIiwidCI6ImQ1NzFiM2Q1LTRkNGItNDRkMy04ZGM3LWZkODkyZjQ1NTQ2OCIsImMiOjR9"
      },
      {
        nombre: "IE",
        descripcion: "Pega aquí el enlace del reporte de IE.",
        url: ""
      }
    ];
    // =================================

    const PESTANAS = [...DASHBOARDS.map(d => ({ ...d, tipo: "reporte" })), { nombre: "Cargar archivos", tipo: "carga" }];
    const nav = document.getElementById("pestanas");
    const iframe = document.getElementById("reporte");
    const panelReporte = document.getElementById("panel-reporte");
    const panelCarga = document.getElementById("panel-carga");

    function mostrar(i) {
      const p = PESTANAS[i];
      panelReporte.hidden = p.tipo !== "reporte";
      panelCarga.hidden = p.tipo !== "carga";
      if (p.tipo === "reporte") {
        document.getElementById("titulo").textContent = p.nombre;
        document.getElementById("descripcion").textContent = p.descripcion;
        iframe.src = p.url || "about:blank";
        iframe.title = p.nombre;
      }
      [...nav.children].forEach((b, j) => b.setAttribute("aria-selected", j === i));
      history.replaceState(null, "", "#" + i);
    }

    PESTANAS.forEach((p, i) => {
      const b = document.createElement("button");
      b.role = "tab";
      b.textContent = p.nombre;
      b.onclick = () => mostrar(i);
      nav.appendChild(b);
    });

    const inicial = parseInt(location.hash.slice(1), 10);
    mostrar(Number.isInteger(inicial) && PESTANAS[inicial] ? inicial : 0);

    fetch("/.auth/me").then(r => r.json()).then(j => {
      if (j.clientPrincipal) document.getElementById("usuario").textContent = j.clientPrincipal.userDetails;
    }).catch(() => {});

    // ----- Carga de archivos -----
    const form = document.getElementById("form-carga");
    const boton = document.getElementById("btn-cargar");
    const resultado = document.getElementById("resultado");

    function aviso(texto, ok) {
      resultado.hidden = false;
      resultado.className = "resultado " + (ok ? "ok" : "err");
      resultado.textContent = texto;
    }

    async function leerJson(r) {
      const texto = await r.text();
      try { return JSON.parse(texto); }
      catch { return { estado: "ERROR", mensaje: `Respuesta inesperada (${r.status}): ${texto.slice(0, 300)}` }; }
    }

    // Consulta cada 5 segundos, hasta 5 minutos, si el job ya procesó el archivo.
    async function esperarResultado(blob) {
      const limite = Date.now() + 5 * 60 * 1000;
      while (Date.now() < limite) {
        await new Promise(ok => setTimeout(ok, 5000));
        const d = await leerJson(await fetch(`/api/estado?blob=${encodeURIComponent(blob)}`));
        if (d.estado !== "PROCESANDO") return d;
      }
      return { estado: "PROCESANDO" };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const archivo = document.getElementById("archivo").files[0];
      const tipo = document.getElementById("tipo").value;
      if (!archivo) return;
      boton.disabled = true;
      boton.textContent = "Cargando…";
      resultado.hidden = true;
      try {
        const url = `/api/cargar?tipo=${encodeURIComponent(tipo)}&nombre=${encodeURIComponent(archivo.name)}`;
        const r = await fetch(url, { method: "POST", body: archivo, headers: { "Content-Type": "application/octet-stream" } });
        const subida = await leerJson(r);
        if (subida.estado !== "RECIBIDO") {
          aviso(`✗ No se pudo subir ${archivo.name}.\n${subida.mensaje || "Error desconocido."}`, false);
          return;
        }
        boton.textContent = "Procesando…";
        aviso(`${archivo.name} recibido. Procesando… (suele tardar menos de un minuto)`, true);
        form.reset();
        const d = await esperarResultado(subida.blob);
        if (d.estado === "COMPLETADO" || d.estado === "ACTUALIZADO") {
          aviso(`✓ ${archivo.name}: cargado (${d.filas_cargadas} filas, carga ${d.carga_id}).`, true);
        } else if (d.estado === "DUPLICADO") {
          aviso(`Este archivo ya se había cargado antes (carga ${d.carga_id}). No se cargó de nuevo.`, true);
        } else if (d.estado === "PROCESANDO") {
          aviso(`${archivo.name} sigue en proceso. Vuelve a revisar en unos minutos; el resultado quedará en el blob.`, true);
        } else {
          aviso(`✗ No se pudo cargar ${archivo.name}.\n${d.mensaje || "Error desconocido."}`, false);
        }
      } catch (err) {
        aviso(`✗ No se pudo conectar con el servidor: ${err.message}`, false);
      } finally {
        boton.disabled = false;
        boton.textContent = "Subir y cargar";
      }
    });
  </script>
</body>
</html>
