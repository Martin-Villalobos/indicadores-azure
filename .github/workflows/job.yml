# Pruebas en cada push (main y dev) / pull request y, sólo en main (prod), imagen del job al registro de Azure
# y actualización del Container Apps Job para que use la imagen nueva; luego una ejecución del job,
# que aplica los sql/*.sql pendientes en MySQL (ver src/indicadores_azure/migraciones.py).
# (La suscripción de prueba no permite "az acr build", así que la imagen se construye aquí.)
#
# Configurar una vez en GitHub → Settings → Secrets and variables → Actions:
#   Variables: ACR_NAME      (ej. acrindicadoresprueba)
#   Secrets:   ACR_USERNAME, ACR_PASSWORD  (az acr credential show -n <acr>)
#   Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (opcionales; sin ellas la
#                imagen se publica pero el job no se actualiza solo). Login sin secretos (OIDC) con una
#                identidad administrada del grupo de recursos: ver infra/identidad_github.sh.
name: job

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q

  imagen:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ACR_NAME != ''
    runs-on: ubuntu-latest
    env:
      REGISTRO: ${{ vars.ACR_NAME }}.azurecr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/indicadores-job:${{ github.sha }}
            ${{ env.REGISTRO }}/indicadores-job:latest
      - run: |
          echo "Imagen publicada: $REGISTRO/indicadores-job:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  actualizar-job:
    needs: imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # login a Azure por OIDC, sin secretos
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      IMAGEN: ${{ vars.ACR_NAME }}.azurecr.io/indicadores-job:${{ github.sha }}
    steps:
      - name: Sin identidad de Azure, se indican los comandos manuales
        if: env.AZURE_CLIENT_ID == ''
        run: |
          echo "El job no se actualizó solo (faltan las variables AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID). En Cloud Shell:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp job update -g rg-prueba-indicadores -n job-cargas --image $IMAGEN" >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp job start -g rg-prueba-indicadores -n job-cargas   # aplica los sql/*.sql pendientes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@v2
        if: env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar el job a la imagen nueva
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp job update -g rg-prueba-indicadores -n job-cargas --image "$IMAGEN" -o none
          echo "Job actualizado a $IMAGEN" >> "$GITHUB_STEP_SUMMARY"
      # El job aplica los sql/*.sql pendientes al partir (indicadores_azure.migraciones); se lanza
      # una ejecución ahora para que la base quede al día sin esperar al próximo archivo.
      - name: Aplicar migraciones de la base
        if: env.AZURE_CLIENT_ID != ''
        run: |
          EJECUCION=$(az containerapp job start -g rg-prueba-indicadores -n job-cargas --query name -o tsv)
          for i in $(seq 1 40); do
            ESTADO=$(az containerapp job execution show -g rg-prueba-indicadores -n job-cargas \
              --job-execution-name "$EJECUCION" --query properties.status -o tsv)
            case "$ESTADO" in
              Succeeded) echo "Migraciones aplicadas (ejecución $EJECUCION)" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::La ejecución $EJECUCION terminó en $ESTADO; revisar sus logs en Azure"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::La ejecución $EJECUCION no terminó en 10 minutos"; exit 1
