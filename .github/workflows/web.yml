# Publica la web (web/app) y su API (web/api) en la Static Web App en cada push a main
# que toque web/. También se puede correr a mano (Actions → web → Run workflow).
#
# Configurar una vez en GitHub → Settings → Secrets and variables → Actions → Secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN = token de implementación
#     (portal → web-indicadores → Información general → Administrar token de implementación)
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Revisar configuración
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN (ver comentario al inicio de web.yml)"
            exit 1
          fi
      - uses: actions/checkout@v4
      # La acción instala las dependencias de web/api/requirements.txt y publica.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/app
          api_location: web/api
          skip_app_build: true
